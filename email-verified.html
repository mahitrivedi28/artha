<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Success — ARTHA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-visual">
    <div class="auth-visual-content">
      <div class="brand"><div class="brand-mark">₹</div><div><div class="brand-name">ARTHA</div><div class="brand-tag">Finance Ledger</div></div></div>
      <div class="auth-quote">"The best budget isn't the strictest one — it's the one you actually <span>keep</span>."</div>
    </div>
    <div class="auth-stats">
      <div><div class="auth-stat-num">₹13.8k</div><div class="auth-stat-label">avg. monthly saved</div></div>
      <div><div class="auth-stat-num">2,400+</div><div class="auth-stat-label">students tracking</div></div>
      <div><div class="auth-stat-num">AES-256</div><div class="auth-stat-label">vault encryption</div></div>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-card">
      <div style="text-align:center; padding:20px 0;">
        <div style="width:64px; height:64px; border-radius:50%; background:rgba(47,109,99,0.12); display:flex; align-items:center; justify-content:center; margin:0 auto 20px;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2F6D63" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="auth-title">All set!</div>
        <div class="auth-sub" style="margin-bottom:28px;">Your password has been updated. You can now sign in with your new credentials.</div>
        <a class="btn btn-primary btn-block btn-lg" href="login.html">Continue to sign in</a>
      </div>

    </div>
  </div>
</div>
<script src="js/app.js"></script>

</body>
</html>
